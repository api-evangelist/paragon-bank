name: Paragon Bank
kind: company
description: 'Paragon Bank PLC is a UK specialist lender and retail savings bank, the principal banking
  subsidiary of Paragon Banking Group PLC (LSE: PAG), a FTSE 250 company founded in 1985 and headquartered
  in Solihull, West Midlands. Authorised by the Prudential Regulation Authority and regulated by the Financial
  Conduct Authority and the Prudential Regulation Authority (Firm Reference Number 604551, company number
  05390593), Paragon offers fixed-rate and easy-access savings accounts and cash ISAs alongside buy-to-let
  and residential mortgages, second-charge mortgages, development finance, motor finance, and asset and
  commercial lending. As a savings-and-lending institution rather than a personal current account provider,
  Paragon is not one of the CMA9 and publishes no public developer portal or Open Banking API surface
  of its own - its accounts are reachable to third parties only through account-information aggregators.
  This profile represents the UK Open Banking Implementation Entity (OBIE) standard - the PSD2 Open Data
  reference APIs and the FAPI-secured Read/Write family (Account and Transaction Information, Payment
  Initiation, Confirmation of Funds) - captured verbatim as the shared industry standard and clearly labelled
  as unverified for this bank; no Paragon-hosted endpoint was confirmed at profiling time.'
