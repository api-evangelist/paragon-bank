    url: openapi/obie-confirmation-funds-standard.yaml
  - type: Documentation
    url: https://openbankinguk.github.io/read-write-api-site3/v3.1.11/profiles/confirmation-of-funds-api-profile.html
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
