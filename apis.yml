apis:
- aid: paragon-bank:paragon-open-data-api
  name: Paragon Bank Open Data API (OBIE standard, unverified)
  description: The UK Open Banking Open Data API - a public, unauthenticated reference-data surface (ATMs,
    branches, personal and business current accounts, unsecured SME loans, commercial credit cards) defined
    by the Open Banking Implementation Entity. Captured here as the shared OBIE standard; Paragon Bank
    does not publish a confirmed Open Data endpoint (no live host was verified) and, as a savings-and-lending
    bank without current accounts, has no CMA9 Open Data obligation.
  humanURL: https://openbankinguk.github.io/opendata-api-docs-pub/v2.4.0/
  tags:
  - Open Data
  - Reference Data
  - Public
  properties:
  - type: OpenAPI
    url: openapi/obie-opendata-standard.json
  - type: Documentation
    url: https://openbankinguk.github.io/opendata-api-docs-pub/v2.4.0/
  - type: APIReference
    url: https://github.com/OpenBankingUK/opendata-api-spec-compiled
- aid: paragon-bank:paragon-account-information-api
  name: Paragon Bank Account and Transaction Information API (OBIE standard, unverified)
  description: The OBIE Read/Write Account and Transaction Information (AIS) API standard - FAPI-secured
    (OAuth2/OIDC, mutual-TLS, PSD2 strong customer authentication) account, balance, transaction, and
    party data access for authorised third parties. Captured here as the shared OBIE standard specification,
    not a Paragon-hosted contract; no Paragon AIS endpoint or developer onboarding was confirmed at profiling
    time.
  humanURL: https://openbankinguk.github.io/read-write-api-site3/v3.1.11/profiles/account-and-transaction-api-profile.html
  tags:
  - Account Information
  - Transactions
  - AIS
  - FAPI
  properties:
  - type: OpenAPI
    url: openapi/obie-account-info-standard.yaml
  - type: Documentation
    url: https://openbankinguk.github.io/read-write-api-site3/v3.1.11/profiles/account-and-transaction-api-profile.html
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
- aid: paragon-bank:paragon-payment-initiation-api
  name: Paragon Bank Payment Initiation API (OBIE standard, unverified)
  description: The OBIE Read/Write Payment Initiation (PIS) API standard - FAPI-secured initiation of
    domestic, scheduled, standing-order, international, and file payments on behalf of a customer with
    PSD2 strong customer authentication. Captured here as the shared OBIE standard specification, not
    a Paragon-hosted contract; no Paragon PIS endpoint was confirmed and Paragon does not document payment-initiation
    services.
  humanURL: https://openbankinguk.github.io/read-write-api-site3/v3.1.11/profiles/payment-initiation-api-profile.html
  tags:
  - Payment Initiation
  - Payments
  - PIS
  - FAPI
  properties:
  - type: OpenAPI
    url: openapi/obie-payment-initiation-standard.yaml
  - type: Documentation
    url: https://openbankinguk.github.io/read-write-api-site3/v3.1.11/profiles/payment-initiation-api-profile.html
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
- aid: paragon-bank:paragon-confirmation-of-funds-api
  name: Paragon Bank Confirmation of Funds API (OBIE standard, unverified)
  description: The OBIE Read/Write Confirmation of Funds (CBPII) API standard - FAPI-secured yes/no confirmation
    of available funds for a card-based payment instrument issuer. Captured here as the shared OBIE standard
    specification, not a Paragon-hosted contract; no Paragon CBPII endpoint was confirmed at profiling
    time.
  humanURL: https://openbankinguk.github.io/read-write-api-site3/v3.1.11/profiles/confirmation-of-funds-api-profile.html
  tags:
  - Confirmation of Funds
  - CBPII
  - FAPI
  properties:
